# Render Blueprint — one Web Service (backend + built frontend in a single container, built from the
# root Dockerfile) plus one managed Postgres database. Review it in the Render dashboard before
# applying. Nothing here depends on a URL that is only known after deploy: the frontend is served by
# the backend on the same origin, so there is no CORS or API-URL wiring to do (see DEPLOY.md).
databases:
  - name: familyid-db
    databaseName: familyid
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: familyid
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: familyid-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "720"
      - key: DEV_MODE
        value: "false"
      - key: DEMO_OTP
        value: "123456"
      # Not needed for the app's own requests (same origin). Only set this if another site or a
      # custom-domain frontend must call the API cross-origin.
      - key: CORS_ORIGINS
        value: ""
      # Leave blank to store uploaded documents on local (ephemeral) disk; set all three to use
      # Cloudinary instead, which is strongly recommended in production — see DEPLOY.md.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Leave blank to disable email OTP delivery (mobile OTP still works).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: noreply@familyid.gov.in
      # Loads the demo dataset on first boot only if the database is still empty. Never leave this
      # "true" long-term, and never combine with SEED_RESET=true against real data.
      - key: SEED_ON_BOOT
        value: "true"
      - key: SEED_RESET
        value: "false"
