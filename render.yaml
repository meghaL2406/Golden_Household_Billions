# Render Blueprint — a best-effort starting point for a one-click deploy.
# Review it in the Render dashboard before applying; some values (CORS_ORIGINS, API_URL) can only
# be filled in after both services exist and their *.onrender.com URLs are known (see DEPLOY.md).
databases:
  - name: familyid-db
    databaseName: familyid
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: familyid-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: familyid-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "720"
      - key: DEV_MODE
        value: "false"
      - key: DEMO_OTP
        value: "123456"
      # Set once the frontend service's URL is known, e.g. https://familyid-frontend.onrender.com
      - key: CORS_ORIGINS
        sync: false
      # Leave blank to store uploaded documents on local (ephemeral) disk; set all three to use
      # Cloudinary instead, which is strongly recommended in production — see DEPLOY.md.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Leave blank to disable email OTP delivery (mobile OTP still works).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: noreply@familyid.gov.in
      # Loads the demo dataset on first boot only if the database is still empty. Never leave this
      # "true" long-term, and never combine with SEED_RESET=true against real data.
      - key: SEED_ON_BOOT
        value: "false"
      - key: SEED_RESET
        value: "false"

  - type: web
    name: familyid-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      # Set to the backend service's public URL, e.g. https://familyid-backend.onrender.com
      - key: API_URL
        sync: false
