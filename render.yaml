# Render Blueprint — one Web Service (API + built frontend, built from the root Dockerfile) plus one
# managed PostgreSQL database. Zero prompts: every value is fixed, generated, or wired from the
# database, so "New → Blueprint → pick this repo → Apply" is the whole procedure.
#
# Without the blueprint (New → Web Service, Docker, this repo) the same image also works with no
# environment variables at all: it starts an embedded PostgreSQL inside the container. That is fine
# for demos; use this blueprint (managed Postgres) when data must survive deploys — see DEPLOY.md.
databases:
  - name: familyid-db
    databaseName: familyid
    user: familyid
    plan: free            # Render's free Postgres expires after 30 days; use a paid plan for longer runs
    postgresMajorVersion: "16"

services:
  - type: web
    name: familyid
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: familyid-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "720"
      # Demo mode: the fixed OTP below is accepted and echoed by the API, because no SMS gateway is
      # wired in. Set DEV_MODE=false only once real OTP delivery (SMTP for email) is configured.
      - key: DEV_MODE
        value: "true"
      - key: DEMO_OTP
        value: "123456"
      # Same origin for API and frontend: CORS is not needed for the app itself.
      - key: CORS_ORIGINS
        value: ""
      # Loads the demo dataset when the database has no users; a no-op afterwards.
      - key: SEED_ON_BOOT
        value: "true"
      - key: SEED_RESET
        value: "false"
      - key: WEB_CONCURRENCY
        value: "2"
      # Optional integrations, off by default. Fill in later from the dashboard if wanted:
      # Cloudinary keeps uploaded documents across deploys; SMTP enables email OTP.
      - key: CLOUDINARY_CLOUD_NAME
        value: ""
      - key: CLOUDINARY_API_KEY
        value: ""
      - key: CLOUDINARY_API_SECRET
        value: ""
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASSWORD
        value: ""
      - key: SMTP_FROM
        value: noreply@familyid.gov.in
