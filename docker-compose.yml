# Local run of the production image: the single-service container (root Dockerfile) plus a separate
# Postgres, i.e. the managed-database shape used by the Render blueprint.
#   docker compose up --build         →  http://localhost:8000  (API docs at /docs)
#
# The image also runs with no database and no variables at all (embedded PostgreSQL), exactly as a
# plain Render Web Service would:   docker build -t familyid . && docker run --rm -p 8000:8000 familyid
#
# To run the backend and frontend as two separate containers instead (backend/Dockerfile and
# frontend/Dockerfile), use:  docker compose -f docker-compose.two-services.yml up --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: familyid
      POSTGRES_USER: familyid
      POSTGRES_PASSWORD: familyid
    volumes:
      - familyid_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familyid -d familyid"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://familyid:familyid@db:5432/familyid
      JWT_SECRET: dev-only-secret-change-me
      DEV_MODE: "true"
      DEMO_OTP: "123456"
      SEED_ON_BOOT: "true"
      PORT: "8000"
    volumes:
      - familyid_uploads:/app/uploads
    ports:
      - "8000:8000"

volumes:
  familyid_db_data:
  familyid_uploads:
